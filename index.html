<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AWR1843 radar view</title>
<style>
  body { margin: 0; background: #050510; overflow: hidden; font-family: system-ui, sans-serif; }
  #hud { position: absolute; top: 10px; left: 10px; color: #8af; font-size: 13px;
         line-height: 1.5; white-space: pre; z-index: 1; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">connecting...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ----- tuning -----
const MAX_POINTS = 6000;          // ring buffer size; older points get overwritten
const FADE = 0.96;                // per-frame brightness multiplier; closer to 1 = longer trails
const POINT_SIZE = 0.07;
const NOISE_DIM = 0.25;           // brightness of points that aren't part of an object
const SPEED_FOR_FULL_COLOR = 1.0; // m/s
const BLOB_SMOOTH = 0.35;         // 0..1. Higher = objects follow faster, lower = smoother
const BLOB_MATCH_DIST = 0.8;      // m. A new object within this distance continues an existing one
// ------------------

let showNoise = true;

// ---- scene ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.GridHelper(12, 24, 0x1a2a44, 0x0e1626));

// Range rings every 1 m around the radar, plus the radar itself
for (let r = 1; r <= 6; r++) {
  const curve = new THREE.EllipseCurve(0, 0, r, r, 0, 2 * Math.PI);
  const g = new THREE.BufferGeometry().setFromPoints(curve.getPoints(96));
  const ring = new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: 0x23406e }));
  ring.rotation.x = -Math.PI / 2;
  scene.add(ring);
}
const radarBox = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.04),
  new THREE.MeshBasicMaterial({ color: 0xff4444 }));
scene.add(radarBox);

// ---- mouse orbit: drag to rotate, scroll to zoom ----
let yaw = 0, pitch = 0.4, dist = 7;
const target = new THREE.Vector3(0, 0.3, -2.5);
function updateCamera() {
  camera.position.set(
    target.x + dist * Math.sin(yaw) * Math.cos(pitch),
    target.y + dist * Math.sin(pitch),
    target.z + dist * Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(target);
}
updateCamera();
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener("mousedown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener("mouseup", () => { dragging = false; });
addEventListener("mousemove", (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.005;
  pitch = Math.min(1.45, Math.max(0.02, pitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener("wheel", (e) => {
  dist = Math.min(25, Math.max(1.5, dist * (e.deltaY > 0 ? 1.1 : 0.9)));
  updateCamera();
  e.preventDefault();
}, { passive: false });
addEventListener("keydown", (e) => {
  if (e.key === "n" || e.key === "N") showNoise = !showNoise;
  if (e.key === "r" || e.key === "R") { yaw = 0; pitch = 0.4; dist = 7; updateCamera(); }
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- colors: positive velocity = red, negative = blue, faster = brighter ----
// If approaching objects show up blue, swap the two branches.
function velocityColor(v) {
  const s = Math.min(Math.abs(v) / SPEED_FOR_FULL_COLOR, 1);
  const b = 0.45 + 0.55 * s;
  return v >= 0 ? [b, 0.35 * b, 0.2 * b] : [0.25 * b, 0.6 * b, b];
}

// Radar: x = right, y = forward, z = up. Three.js: y = up, forward = -z.
const toScene = (x, y, z) => new THREE.Vector3(x, z, -y);

// ---- point trails ----
const positions = new Float32Array(MAX_POINTS * 3);
const colors = new Float32Array(MAX_POINTS * 3);
const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
scene.add(new THREE.Points(geometry, new THREE.PointsMaterial({
  size: POINT_SIZE, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false })));
let head = 0;

function addPoint(x, y, z, v, inObject) {
  if (!inObject && !showNoise) return;
  const p = toScene(x, y, z);
  const i = head * 3;
  positions[i] = p.x; positions[i + 1] = p.y; positions[i + 2] = p.z;
  const c = velocityColor(v);
  const k = inObject ? 1 : NOISE_DIM;
  colors[i] = c[0] * k; colors[i + 1] = c[1] * k; colors[i + 2] = c[2] * k;
  head = (head + 1) % MAX_POINTS;
}

// ---- objects: glowing spheres with a floor ring, smoothed over time ----
const blobs = [];
const sphereGeo = new THREE.SphereGeometry(1, 24, 16);
const ringGeo = new THREE.RingGeometry(0.85, 1.0, 48);

function makeBlob(pos) {
  const mesh = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({
    transparent: true, opacity: 0.3, depthWrite: false, blending: THREE.AdditiveBlending }));
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2;
  scene.add(mesh); scene.add(ring);
  return { mesh, ring, pos: pos.clone(), radius: 0.3, v: 0, life: 1, seen: true };
}

function removeBlob(b) {
  scene.remove(b.mesh); scene.remove(b.ring);
  b.mesh.material.dispose(); b.ring.material.dispose();
}

function updateBlobs(clusters) {
  blobs.forEach((b) => { b.seen = false; });
  for (const [cx, cy, cz, v, count, radius] of clusters) {
    const p = toScene(cx, cy, cz);
    let best = null, bestD = BLOB_MATCH_DIST;
    for (const b of blobs) {
      if (b.seen) continue;
      const d = b.pos.distanceTo(p);
      if (d < bestD) { best = b; bestD = d; }
    }
    if (!best) { best = makeBlob(p); blobs.push(best); }
    best.pos.lerp(p, BLOB_SMOOTH);
    best.radius += (Math.min(radius, 1.0) - best.radius) * BLOB_SMOOTH;
    best.v += (v - best.v) * BLOB_SMOOTH;
    best.life = 1;
    best.seen = true;
  }
}

// ---- data ----
const hud = document.getElementById("hud");
let status = "connecting...", stats = { raw: 0, kept: 0, objects: 0 }, frames = 0;
function drawHud() {
  hud.textContent =
    `${status}\n` +
    `frames: ${frames}   raw points: ${stats.raw}   kept: ${stats.kept}   objects: ${stats.objects}\n` +
    `drag = orbit   scroll = zoom   N = ${showNoise ? "hide" : "show"} noise   R = reset view`;
}

const ws = new WebSocket("ws://localhost:8765");
ws.onopen = () => { status = "connected"; drawHud(); };
ws.onclose = () => { status = "disconnected: is radar_server.py running?"; drawHud(); };
ws.onerror = () => { status = "can't connect: is radar_server.py running?"; drawHud(); };
ws.onmessage = (e) => {
  const data = JSON.parse(e.data);
  frames++;
  if (Array.isArray(data)) {                       // older server: plain point list
    for (const [x, y, z, v] of data) addPoint(x, y, z, v, true);
    stats = { raw: data.length, kept: data.length, objects: 0 };
  } else {
    for (const [x, y, z, v, snr, label] of data.points) addPoint(x, y, z, v, label >= 0);
    updateBlobs(data.clusters);
    stats = { raw: data.raw, kept: data.points.length, objects: data.clusters.length };
  }
  drawHud();
};

// ---- render loop ----
function animate() {
  for (let j = 0; j < colors.length; j++) colors[j] *= FADE;
  geometry.attributes.color.needsUpdate = true;
  geometry.attributes.position.needsUpdate = true;

  for (let i = blobs.length - 1; i >= 0; i--) {
    const b = blobs[i];
    if (!b.seen) b.life -= 0.03;
    if (b.life <= 0) { removeBlob(b); blobs.splice(i, 1); continue; }
    const c = velocityColor(b.v);
    b.mesh.position.copy(b.pos);
    b.mesh.scale.setScalar(b.radius);
    b.mesh.material.color.setRGB(c[0], c[1], c[2]);
    b.mesh.material.opacity = 0.3 * b.life;
    b.ring.position.set(b.pos.x, 0.01, b.pos.z);
    b.ring.scale.setScalar(b.radius);
    b.ring.material.color.setRGB(c[0], c[1], c[2]);
    b.ring.material.opacity = 0.6 * b.life;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
drawHud();
animate();
</script>
</body>
</html>
